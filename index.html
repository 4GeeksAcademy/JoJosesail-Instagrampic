<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagram Post</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      background: #fafafa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .insta-post {
      width: 370px;
      border: 2px solid #222;
      border-radius: 8px;
      background: #fff;
      margin: auto;
      box-shadow: 0 2px 8px #0001;
    }
    .insta-header {
      display: flex;
      align-items: center;
      padding: 14px 14px 10px 14px;
      border-bottom: 1px solid #eee;
    }
    .insta-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #e1306c;
      margin-right: 10px;
      background: #222;
      box-sizing: border-box;
    }
    .insta-user {
      flex: 1;
    }
    .insta-user span {
      display: block;
      font-weight: bold;
      font-size: 15px;
    }
    .insta-user small {
      color: #888;
      font-size: 13px;
    }
    .insta-menu {
      font-size: 22px;
      color: #888;
      cursor: pointer;
    }
    .insta-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid #eee;
    }
    .insta-actions {
      display: flex;
      align-items: center;
      padding: 10px 14px 0 14px;
    }
    .insta-actions i {
      font-size: 24px;
      margin-right: 14px;
      cursor: pointer;
      color: #111;
      transition: color 0.2s ease;
    }
    .icon-like:hover {
      color: #e63946;
    }
    .icon-comment:hover {
      color: #1d4ed8;
    }
    .icon-share:hover {
      color: #0f766e;
    }
    .insta-likes {
      font-weight: bold;
      padding: 4px 14px 0 14px;
      font-size: 15px;
    }
    .insta-caption {
      padding: 6px 14px 14px 14px;
      font-size: 15px;
      color: #222;
    }
    .insta-caption b {
      font-weight: bold;
      margin-right: 4px;
    }
    .insta-caption .hashtag {
      color: #3897f0;
      text-decoration: none;
      margin-right: 2px;
    }
  </style>
</head>
<body>
  <div class="insta-post">
    <div class="insta-header">
      <div class="insta-avatar"></div>
      <div class="insta-user">
        <span>Josesail</span>
        <small>Caracas, Vzla</small>
      </div>
      <div class="insta-menu">&#8942;</div>
    </div>
    <img class="insta-img" src="https://picsum.photos/id/1005/1200/900" alt="Imagen del post" loading="eager" decoding="async">
    <div class="insta-actions">
      <i class="fa-solid fa-heart icon-like" aria-label="Me gusta"></i>
      <i class="fa-regular fa-comment icon-comment" aria-label="Comentar"></i>
      <i class="fa-regular fa-paper-plane icon-share" aria-label="Compartir"></i>
    </div>
    <div class="insta-likes">212 Likes</div>
    <div class="insta-caption">
      <b>Josesail</b>
      lorem ipsum dolor sit amet
      <a class="hashtag" href="#">#augue</a>
      <a class="hashtag" href="#">#adipiscing</a>
      <a class="hashtag" href="#">#elit</a>
      <a class="hashtag" href="#">#do</a>
      <a class="hashtag" href="#">#eiusmod</a>
      <a class="hashtag" href="#">#tempor</a>
    </div>
  </div>
</body>
</html>
